<!DOCTYPE html> <html lang="ru"> <head> <meta charset="UTF-8"> <meta name="viewport" content="width=device-width, initial-scale=1.0"> <title>Overlay Site</title> <style> iframe { width: 100vw; height: 100vh; border: none; position: absolute; top: 0; left: 0; } .overlay { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: rgba(0, 0, 0, 0.7); color: white; padding: 10px; font-size: 24px; z-index: 9999; } </style> </head> <body> <div class="overlay">Эта надпись поверх сайта</div> <iframe id="siteFrame"></iframe> <script> const urlParams = new URLSearchParams(window.location.search); const site = urlParams.get("site"); if (site) { document.getElementById("siteFrame").src = site; } else { document.getElementById("siteFrame").src = "https://example.com"; } </script> </body> </html>
